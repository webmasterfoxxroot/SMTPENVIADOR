services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: smtpenviador_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-smtpenviador}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smtpenviador123}
      POSTGRES_DB: ${DB_NAME:-smtpenviador}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-smtpenviador}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Queue
  redis:
    image: redis:7-alpine
    container_name: smtpenviador_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ClickHouse - High Performance Analytics Database
  clickhouse:
    image: clickhouse/clickhouse-server:24.1-alpine
    container_name: smtpenviador_clickhouse
    restart: always
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-smtpenviador}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-smtpenviador123}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-smtpenviador}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./database/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native TCP
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # API + Engine
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smtpenviador_api
    restart: always
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-smtpenviador}
      - DB_PASSWORD=${DB_PASSWORD:-smtpenviador123}
      - DB_NAME=${DB_NAME:-smtpenviador}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-smtpenviador}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-smtpenviador123}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-smtpenviador}
      - API_PORT=80
      - API_SECRET=${API_SECRET:-your_super_secret_jwt_key_change_this}
      - WORKERS_COUNT=${WORKERS_COUNT:-10}
      - CONNECTIONS_PER_SMTP=${CONNECTIONS_PER_SMTP:-5}
      - TRACKING_DOMAIN=${TRACKING_DOMAIN:-http://localhost}
    ports:
      - "80:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  # Dashboard Frontend
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: smtpenviador_dashboard
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
